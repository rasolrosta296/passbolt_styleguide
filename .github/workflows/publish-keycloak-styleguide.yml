name: Publish Keycloak styleguide package

on:
  push:
    tags:
      - "keycloak-styleguide-v*"

permissions: {}

concurrency:
  group: publish-keycloak-styleguide-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rasolrosta296/passbolt_styleguide'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and GitHub Packages
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@rasolrosta296"

      - name: Verify immutable package identity
        env:
          EXPECTED_REPOSITORY: rasolrosta296/passbolt_styleguide
          EXPECTED_PACKAGE: "@rasolrosta296/passbolt-styleguide"
        run: |
          node -e '
            const manifest = require("./package.json");
            const expectedTag = `keycloak-styleguide-v${manifest.version}`;
            if (process.env.GITHUB_REPOSITORY !== process.env.EXPECTED_REPOSITORY ||
                process.env.GITHUB_REF_NAME !== expectedTag ||
                manifest.name !== process.env.EXPECTED_PACKAGE ||
                manifest.publishConfig?.registry !== "https://npm.pkg.github.com") {
              throw new Error("The package identity, repository, registry, or release tag is invalid.");
            }
          '

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --registry=https://registry.npmjs.org

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

      - name: Publish exact package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
